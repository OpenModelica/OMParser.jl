name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        julia-version: ['1.13']
    name: Test (${{ matrix.os }}, Julia ${{ matrix.julia-version }})
    steps:
    - uses: actions/checkout@v4

    - uses: julia-actions/setup-julia@v2
      with:
        version: ${{ matrix.julia-version }}

    # The shared action checks the siblings out at the branch that matches this
    # change (the PR branch if the sibling has it, else the PR base branch, else
    # master).
    - name: Clone sibling OM.jl packages
      uses: JKRT/OM.jl/.github/actions/checkout-siblings@master
      with:
        path: ..
        packages: Absyn ImmutableList MetaModelica

    - name: Develop sibling OM.jl packages
      shell: bash
      run: |
        julia --color=yes --project -e '
          import Pkg
          Pkg.Registry.add("General")
          Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/OpenModelica/OpenModelicaRegistry.git"))
          Pkg.develop([
            Pkg.PackageSpec(path="../ImmutableList.jl"),
            Pkg.PackageSpec(path="../MetaModelica.jl"),
            Pkg.PackageSpec(path="../Absyn.jl"),
          ])
          Pkg.instantiate()
        '

    - name: Test
      shell: bash
      run: julia --color=yes --project -e 'import Pkg; Pkg.test("OMParser")'
