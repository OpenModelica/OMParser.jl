name: Build CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ${{ matrix.sys.os }}
    strategy:
      matrix:
        sys:
          - { os: windows-latest, shell: 'msys2 {0}' }
          - { os: ubuntu-latest,  shell: bash  }
          - { os: macos-latest,   shell: bash  }
        julia-version: ['1.11', '1.12']
    defaults:
      run:
        shell: ${{ matrix.sys.shell }}
    name: Build parser (${{ matrix.sys.os }}, Julia ${{ matrix.julia-version }})
    steps:
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
    - name: setup julia environment
      uses: julia-actions/setup-julia@v2
      with:
        version: ${{ matrix.julia-version }}
    - name: setup msys2 environment
      uses: msys2/setup-msys2@v2
      with:
        update: false
        platform-check-severity: warn
        install: autoconf automake m4 pkg-config libtool base-devel mingw-w64-x86_64-toolchain
        path-type: inherit # to find julia!

    - name: set git to use LF on Windows
      if: contains(matrix.sys.os, 'windows')
      run: |
        git config --system core.autocrlf false
        git config --system core.eol lf

    - name: Install autotools if the system is macOS
      if: contains(matrix.sys.os, 'macOS')
      run: |
       brew install autoconf
       brew install automake
       brew install m4
       brew install pkg-config
       brew install libtool

    - uses: actions/checkout@v4

    - name: Clone sibling OM.jl packages
      shell: bash
      run: |
        git clone --depth 1 --branch master https://github.com/OpenModelica/Absyn.jl.git ../Absyn.jl
        git clone --depth 1 --branch master https://github.com/OpenModelica/ImmutableList.jl.git ../ImmutableList.jl
        git clone --depth 1 --branch master https://github.com/OpenModelica/MetaModelica.jl.git ../MetaModelica.jl

    - name: configure the library and build
      run: |
        which gcc
        gcc --version
        cd lib/parser
        autoconf
        ./configure
        make
        cd ../build/lib
        tar -czvf ${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}-library.tar.gz *
        mv ${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}-library.tar.gz '${{ github.workspace }}/'.

    - name: Build
      # Always use bash to avoid having to escape quotes for Windows
      shell: bash
      run: julia --compiled-modules=no --color=yes --project -e 'import Pkg; Pkg.Registry.add("General"); Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/JKRT/OpenModelicaRegistry.git")); Pkg.build(;verbose = true);Pkg.instantiate(); Pkg.resolve()'

    - name:  Test
      run: julia --color=yes --project -e 'import Pkg; Pkg.test("Absyn"); Pkg.test("OMParser")'

    - name: upload library
      uses: actions/upload-artifact@v4
      with:
        name: parser-library-${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}
        path: ${{ github.workspace }}/${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}-library.tar.gz