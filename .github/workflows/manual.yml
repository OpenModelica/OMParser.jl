name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag prefix (e.g. Latest, DBG_RELEASE)'
        default: 'Latest'
        required: true
        type: string
      julia_versions:
        description: 'Julia versions to build'
        default: '["1.13"]'
        required: true
        type: choice
        options:
          - '["1.13"]'
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.sys.os }}
    strategy:
      fail-fast: false
      matrix:
        sys:
          - { os: windows-latest, shell: 'msys2 {0}' }
          - { os: ubuntu-latest,  shell: bash  }
          - { os: macos-latest,   shell: bash  }
        julia-version: ${{ fromJSON(github.event.inputs.julia_versions) }}

    defaults:
      run:
        shell: ${{ matrix.sys.shell }}

    name: Build parser (${{ matrix.sys.os }}, Julia ${{ matrix.julia-version }})

    steps:
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: setup julia environment
      uses: julia-actions/setup-julia@v2
      with:
        version: ${{ matrix.julia-version }}

    - name: setup msys2 environment
      uses: msys2/setup-msys2@v2
      with:
        update: false
        platform-check-severity: warn
        install: autoconf automake m4 pkg-config libtool base-devel mingw-w64-x86_64-toolchain zip
        path-type: inherit # to find julia!

    - name: set git to use LF on Windows
      if: contains(matrix.sys.os, 'windows')
      run: |
        git config --system core.autocrlf false
        git config --system core.eol lf

    - name: Install autotools if the system is macOS
      if: contains(matrix.sys.os, 'macOS')
      run: |
       brew install autoconf
       brew install automake
       brew install m4
       brew install pkg-config
       brew install libtool

    - uses: actions/checkout@v4

    # The shared action checks the siblings out at the branch that matches this
    # change (the PR branch if the sibling has it, else the PR base branch, else
    # master).
    - name: Clone sibling OM.jl packages
      uses: JKRT/OM.jl/.github/actions/checkout-siblings@master
      with:
        path: ..
        packages: Absyn ImmutableList MetaModelica

    - name: configure the library and build
      run: |
        which gcc
        gcc --version
        cd lib/parser
        autoconf
        ./configure
        make
        cd ../build/lib
        tar -czvf ${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}-library.tar.gz *
        mv ${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}-library.tar.gz '${{ github.workspace }}/'.

    - name: Develop sibling OM.jl packages
      shell: bash
      run: |
        julia --compiled-modules=no --color=yes --project -e '
          import Pkg
          Pkg.Registry.add("General")
          Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/OpenModelica/OpenModelicaRegistry.git"))
          Pkg.develop([
            Pkg.PackageSpec(path="../ImmutableList.jl"),
            Pkg.PackageSpec(path="../MetaModelica.jl"),
            Pkg.PackageSpec(path="../Absyn.jl"),
          ])
        '

    - name: Build
      # Always use bash to avoid having to escape quotes for Windows
      shell: bash
      run: julia --compiled-modules=no --color=yes --project -e 'import Pkg; Pkg.Registry.add("General"); Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/OpenModelica/OpenModelicaRegistry.git")); Pkg.build(;verbose = true); Pkg.instantiate(); Pkg.resolve()'

    - name: Run the testsuite
      shell: bash
      run: julia --color=yes --project -e 'import Pkg; Pkg.test("Absyn"); Pkg.test("OMParser")'

    - name: Package release zip
      run: |
        cd "${{ github.workspace }}"
        zip "parser-library-${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}.zip" \
            "${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}-library.tar.gz"

    - name: upload library
      uses: actions/upload-artifact@v4
      with:
        name: parser-library-${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}
        path: ${{ github.workspace }}/parser-library-${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}.zip

    - name: "Perform Release"
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "${{ github.event.inputs.release_tag }}-${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}"
        draft: false
        prerelease: true
        files: |
          parser-library-${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}.zip
