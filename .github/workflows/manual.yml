name: Manual Release

on:
  workflow_dispatch:
    inputs:
    myInput:
      # Friendly description to be shown in the UI instead of 'name'x
      description: 'Trigger a release built'
      # Default value if no value is explicitly provided
      default: 'DBG_RELEASE'
      # Input has to be provided for the workflow to run
      required: true
      type: environment
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ${{ matrix.sys.os }}
    strategy:
      matrix:
        sys:
          - { os: windows-latest, shell: 'msys2 {0}' }
          - { os: ubuntu-latest,  shell: bash  }
          - { os: macos-latest,   shell: bash  }
        julia-version: ['1.10', '1.11', '1.12']

    defaults:
      run:
        shell: ${{ matrix.sys.shell }}

    name: Build parser (${{ matrix.sys.os }}, Julia ${{ matrix.julia-version }})

    steps:

    - name: setup julia environment
      uses: julia-actions/setup-julia@v2
      with:
        version: ${{ matrix.julia-version }}

    - name: setup msys2 environment
      uses: msys2/setup-msys2@v2
      with:
        update: false
        platform-check-severity: warn
        install: autoconf automake m4 pkg-config libtool base-devel mingw-w64-x86_64-toolchain
        path-type: inherit # to find julia!

    - name: set git to use LF on Windows
      if: contains(matrix.sys.os, 'windows')
      run: |
        git config --system core.autocrlf false
        git config --system core.eol lf

    - name: Install autotools if the system is macOS
      if: contains(matrix.sys.os, 'macOS')
      run: |
       brew install autoconf
       brew install automake
       brew install m4
       brew install pkg-config
       brew install libtool

    - uses: actions/checkout@v4

    - name: Clone sibling OM.jl packages
      shell: bash
      run: |
        git clone --depth 1 --branch master https://github.com/OpenModelica/Absyn.jl.git ../Absyn.jl
        git clone --depth 1 --branch master https://github.com/OpenModelica/ImmutableList.jl.git ../ImmutableList.jl
        git clone --depth 1 --branch master https://github.com/OpenModelica/MetaModelica.jl.git ../MetaModelica.jl

    - name: configure the library and build
      run: |
        which gcc
        gcc --version
        cd lib/parser
        autoconf
        ./configure
        make
        cd ../build/lib
        tar -czvf ${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}-library.tar.gz *
        mv ${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}-library.tar.gz '${{ github.workspace }}/'.

    - name: Run the testsuite
      shell: bash
      run: julia --color=yes --project -e 'import Pkg; Pkg.test("Absyn"); Pkg.test("OMParser")'

    - name: Package release zip
      shell: bash
      run: |
        cd "${{ github.workspace }}"
        zip "parser-library-${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}.zip" \
            "${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}-library.tar.gz"

    - name: upload library
      uses: actions/upload-artifact@v4
      with:
        name: parser-library-${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}
        path: ${{ github.workspace }}/parser-library-${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}.zip

    - name: "Perform Release"
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "${{ github.event.inputs.myInput }}-${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}"
        draft: false
        prerelease: true
        files: |
          parser-library-${{ matrix.sys.os }}-julia-${{ matrix.julia-version }}.zip
